services:
  frontend:
    image: alextskm/kittygram_frontend:latest
    restart: always
    command: cp -r /app/dist/. /static/
    volumes:
      - static:/static

  db:
    image: postgres:13
    env_file: .env
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kittygram_user -d kittygram"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: alextskm/kittygram_backend:latest
    env_file: .env
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/api/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - static:/app/static/
      - media:/app/media/

  gateway:
    image: alextskm/kittygram_gateway:latest
    env_file: .env
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 9000:80
    volumes:
      - static:/static
      - media:/media/

volumes:
  pg_data:
  static:
  media:
